<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="18%" r="88%">
      <stop offset="0" stop-color="#35230e" />
      <stop offset="0.42" stop-color="#15100a" />
      <stop offset="1" stop-color="#070706" />
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd078" />
      <stop offset="1" stop-color="#e99c35" />
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="900" height="900" rx="54" fill="url(#bgGlow)" />
  <circle cx="755" cy="164" r="185" fill="none" stroke="#e9a84a" stroke-opacity="0.14" stroke-width="2" />
  <circle cx="755" cy="164" r="120" fill="none" stroke="#e9a84a" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="7 12" />
  <circle cx="718" cy="622" r="170" fill="#e9a84a" fill-opacity="0.08" filter="url(#softGlow)" />

  <g transform="translate(68 66)">
    <rect width="56" height="56" rx="17" fill="#f8f3e8" filter="url(#shadow)" />
    <g transform="translate(13 13)" fill="none" stroke="#282520" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5v8" />
      <path d="m15 13-9 12" />
      <path d="m15 13 9 12" />
      <circle cx="15" cy="4" r="3" fill="#e9a84a" stroke="none" />
      <circle cx="5" cy="26" r="3" fill="#282520" stroke="none" />
      <circle cx="25" cy="26" r="3" fill="#282520" stroke="none" />
    </g>
    <text x="76" y="31" fill="#fff9ef" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" letter-spacing="4">光影成章</text>
    <text x="77" y="51" fill="#8f877b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="5">FAMORISE</text>
  </g>

  <text x="70" y="190" fill="#efad4d" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20" font-weight="650" letter-spacing="8">家庭记忆生命体</text>
  <text x="66" y="288" fill="#fff9ef" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="72" font-weight="520" letter-spacing="-3">让一家人的时光，</text>
  <text x="66" y="382" fill="url(#amber)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="72" font-weight="520" letter-spacing="-3">长成会陪伴的生命。</text>

  <line x1="70" y1="450" x2="830" y2="450" stroke="#ffffff" stroke-opacity="0.12" />
  <text x="70" y="510" fill="#c9c0b3" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="420">驻留在家庭算力中的记忆生命体</text>
  <text x="70" y="554" fill="#81796f" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="19">照片留在家里，理解也在家里完成。</text>

  <g transform="translate(620 590)" filter="url(#shadow)">
    <circle cx="100" cy="100" r="98" fill="#120f0b" stroke="#e9a84a" stroke-opacity="0.34" stroke-width="2" />
    <circle cx="100" cy="100" r="70" fill="none" stroke="#e9a84a" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="5 9" />
    <g transform="translate(57 50)" fill="none" stroke="#f4ebdc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 9v34" />
      <path d="M43 43 12 88" />
      <path d="m43 43 31 45" />
    </g>
    <circle cx="100" cy="57" r="11" fill="#efad4d" />
    <circle cx="69" cy="138" r="12" fill="#f4ebdc" />
    <circle cx="131" cy="138" r="12" fill="#f4ebdc" />
  </g>

  <g transform="translate(70 746)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <g>
      <rect width="152" height="58" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="28" cy="29" r="5" fill="#efad4d" />
      <text x="46" y="37" fill="#eee5d8" font-size="20" font-weight="560">本地算力</text>
    </g>
    <g transform="translate(168)">
      <rect width="152" height="58" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="28" cy="29" r="5" fill="#efad4d" />
      <text x="46" y="37" fill="#eee5d8" font-size="20" font-weight="560">数据本地</text>
    </g>
    <g transform="translate(336)">
      <rect width="152" height="58" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="28" cy="29" r="5" fill="#efad4d" />
      <text x="46" y="37" fill="#eee5d8" font-size="20" font-weight="560">隐私可控</text>
    </g>
  </g>

  <text x="70" y="855" fill="#625b52" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2">让真正值得被想起的家庭记忆，在合适的时候主动回来。</text>
</svg>
